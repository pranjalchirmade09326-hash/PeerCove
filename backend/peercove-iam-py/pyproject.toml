[project]
name = "peercove-iam-py"
version = "0.1.0"
description = "PeerCove identity provider (FastAPI + PostgreSQL), Python port of peercove-iam"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.9.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
