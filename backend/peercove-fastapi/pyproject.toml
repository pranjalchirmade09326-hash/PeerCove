[project]
name = "peercove-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pranjal Chirmade", email = "pranjalchirmade09326@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
peercove-fastapi = "app.main:main"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-p no:asyncio"

