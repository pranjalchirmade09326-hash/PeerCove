services:
  peercove-agents:
    build: .
    image: kipla1412/finalvoiceagent:latest
    container_name: peercove-agents
    volumes:
      - ./src:/app/src
    ports:
      - "8018:8018"
    env_file:
      - .env
    environment:
      PORT: 8018
      API_KEY: ${API_KEY:?Set API_KEY in agents/.env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SARVAM_API_KEY: ${SARVAM_API_KEY:?Set SARVAM_API_KEY in agents/.env}
      IAM_JWKS_URL: "http://host.docker.internal:5001/api/auth/jwks"
      IAM_ISSUER: "http://localhost:5001"
      FHIR_BASE_URL: "http://host.docker.internal:8002/mcp/"
      JINA_BASE_URL: "https://api.jina.ai/v1/embeddings"
      JINA_API_KEY: ${JINA_API_KEY:?Set JINA_API_KEY in agents/.env}
      OPENSEARCH_URL: "http://host.docker.internal:9200"
      MEDICAL_DOCUMENT_INDEX: "peercove_documents"
      OPENSEARCH_SEARCH_PIPELINE: "hybrid-rrf-pipeline"
    restart: unless-stopped
