# Render Blueprint Specification for PeerCove Architecture
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ── PeerCove FastAPI Core Backend ────────────────────────────
  - type: web
    name: peercove-fastapi
    runtime: docker
    dockerfilePath: backend/peercove-fastapi/Dockerfile
    dockerContext: backend/peercove-fastapi
    region: oregon
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Neon pooled connection string (-pooler & sslmode=require)
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:4000,http://localhost:3000"
      - key: INTAKE_ENCRYPTION_KEYS_JSON
        value: '{"v1":"q2xePGHE57EuQkCoRMXPPz1zJsqpDGoqgTnImucQ1MY="}'
      - key: INTAKE_CURRENT_ENCRYPTION_KEY_VERSION
        value: "v1"
      - key: AUTH_ISSUER
        value: "http://localhost:5001"
      - key: AUTH_AUDIENCE
        value: "peercove-api"
      - key: ENVIRONMENT
        value: "production"

  # ── PeerCove Multi-Agent Intelligence (Optional) ─────────────
  - type: web
    name: peercove-agents
    runtime: docker
    dockerfilePath: agents/Dockerfile
    dockerContext: agents
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard with your Gemini API key
      - key: PORT
        value: "8018"
