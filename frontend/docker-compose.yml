# Local development stack for PeerCove.
#
# Redis is provisioned for future caching/session use. Nothing in the
# app talks to it yet, so it's safe to leave running idle.
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop, keep data
#   docker compose down -v       # stop and wipe volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: peercove-frontend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peercove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peercove}
      POSTGRES_DB: ${POSTGRES_DB:-peercove}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peercove}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-db-init:
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:4000}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:5001}
        NEXT_PUBLIC_BETTER_AUTH_CLIENT_ID: ${NEXT_PUBLIC_BETTER_AUTH_CLIENT_ID:-}
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-local}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peercove}:${POSTGRES_PASSWORD:-peercove}@postgres:5432/${POSTGRES_DB:-peercove}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:4000}
        NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost:5001}
        NEXT_PUBLIC_BETTER_AUTH_CLIENT_ID: ${NEXT_PUBLIC_BETTER_AUTH_CLIENT_ID:-}
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-local}
    container_name: peercove-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peercove}:${POSTGRES_PASSWORD:-peercove}@postgres:5432/${POSTGRES_DB:-peercove}?schema=public
      BETTER_AUTH_URL: http://host.docker.internal:5001
      PEERCOVE_API_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      frontend-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: peercove-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
